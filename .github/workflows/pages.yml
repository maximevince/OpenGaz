name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Guard — no original LavaMind assets tracked
        run: pnpm guard:no-original-assets
      - id: pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Build
        # base_path is "/<repo>/" for project pages, "" for user/org pages
        run: BASE_PATH="${{ steps.pages.outputs.base_path }}/" pnpm build
      - name: Guard — no dev inspector in the deployed bundle
        run: pnpm guard:no-debug
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
