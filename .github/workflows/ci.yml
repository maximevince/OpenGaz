name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Guard — no original LavaMind assets tracked
        run: pnpm guard:no-original-assets
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - name: Layout audit — nothing clipped off the 640x480 stage
        run: |
          if command -v google-chrome-stable >/dev/null; then
            export CHROME="$(command -v google-chrome-stable)"
          elif command -v chromium-browser >/dev/null; then
            export CHROME="$(command -v chromium-browser)"
          else
            sudo apt-get update && sudo apt-get install -y chromium-browser
            export CHROME="$(command -v chromium-browser)"
          fi
          pnpm test:layout
      - run: pnpm build
      - name: Guard — no dev inspector in the production bundle
        run: pnpm guard:no-debug
